<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Clock &amp; Weather</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    color: #fff;
    font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4vh;
  }
  #time {
    font-size: 18vw;
    font-weight: 300;
    letter-spacing: 0.03em;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  #date {
    font-size: 5vw;
    color: #aaa;
    font-weight: 300;
  }
  #weather {
    display: flex;
    align-items: center;
    gap: 3vw;
    font-size: 6vw;
    color: #ddd;
  }
  #weather-icon {
    font-size: 10vw;
    line-height: 1;
  }
  #weather-temp {
    font-weight: 300;
  }
  #weather-desc {
    font-size: 3.5vw;
    color: #888;
  }
  #weather-col {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
</style>
</head>
<body onclick="goToButtons()">
  <div id="time">--:--</div>
  <div id="date">----年--月--日(-)</div>
  <div id="weather">
    <div id="weather-icon">-</div>
    <div id="weather-col">
      <div id="weather-temp">--°C</div>
      <div id="weather-desc">読み込み中...</div>
    </div>
  </div>

<script>
// ---- Settings: edit these before use -------------------------------------
// Weather location (Open-Meteo, no API key required). Default: Tokyo.
const LAT = 35.6812;
const LON = 139.7671;

// Tap anywhere to return to the Companion button page.
// Requires Fully Kiosk Remote Administration (PLUS licence) to be enabled;
// host/port/password must match that device's Remote Administration settings.
const FULLY_HOST = "192.168.1.221";     // Echo Show IP
const FULLY_PORT = "2323";
const FULLY_PASSWORD = "CHANGE_ME";     // Fully Kiosk Remote Admin password
const BUTTONS_URL = "http://192.168.1.30:8000/emulator/YOUR_EMULATOR_ID";
// --------------------------------------------------------------------------

function goToButtons() {
  const url = `http://${FULLY_HOST}:${FULLY_PORT}/?cmd=loadUrl&url=${encodeURIComponent(BUTTONS_URL)}&password=${FULLY_PASSWORD}&type=json`;
  fetch(url).catch(() => {});
}

const weekdays = ["日", "月", "火", "水", "木", "金", "土"];

function updateClock() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  document.getElementById("time").textContent = `${hh}:${mm}:${ss}`;

  const y = now.getFullYear();
  const mo = now.getMonth() + 1;
  const d = now.getDate();
  const w = weekdays[now.getDay()];
  document.getElementById("date").textContent = `${y}年${mo}月${d}日(${w})`;
}

// WMO weather code -> [emoji, Japanese description]
const WEATHER_CODES = {
  0: ["☀️", "快晴"],
  1: ["🌤️", "晴れ"],
  2: ["⛅", "曇り時々晴れ"],
  3: ["☁️", "曇り"],
  45: ["🌫️", "霧"],
  48: ["🌫️", "霧氷"],
  51: ["🌦️", "小雨"],
  53: ["🌦️", "弱い雨"],
  55: ["🌧️", "雨"],
  56: ["🌧️", "着氷性の雨"],
  57: ["🌧️", "着氷性の雨"],
  61: ["🌧️", "小雨"],
  63: ["🌧️", "雨"],
  65: ["🌧️", "強い雨"],
  66: ["🌧️", "着氷性の雨"],
  67: ["🌧️", "着氷性の雨"],
  71: ["🌨️", "小雪"],
  73: ["🌨️", "雪"],
  75: ["❄️", "大雪"],
  77: ["❄️", "雪"],
  80: ["🌦️", "にわか雨"],
  81: ["🌧️", "にわか雨"],
  82: ["⛈️", "激しいにわか雨"],
  85: ["🌨️", "にわか雪"],
  86: ["❄️", "激しいにわか雪"],
  95: ["⛈️", "雷雨"],
  96: ["⛈️", "雷雨(雹)"],
  99: ["⛈️", "激しい雷雨(雹)"],
};

async function updateWeather() {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,weather_code&timezone=Asia%2FTokyo`
    );
    const data = await res.json();
    const temp = Math.round(data.current.temperature_2m);
    const code = data.current.weather_code;
    const [icon, desc] = WEATHER_CODES[code] || ["❓", "不明"];
    document.getElementById("weather-icon").textContent = icon;
    document.getElementById("weather-temp").textContent = `${temp}°C`;
    document.getElementById("weather-desc").textContent = desc;
  } catch (e) {
    document.getElementById("weather-desc").textContent = "取得失敗";
  }
}

updateClock();
updateWeather();
setInterval(updateClock, 1000);
setInterval(updateWeather, 10 * 60 * 1000);
</script>
</body>
</html>
